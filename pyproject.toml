[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum_core_math"
version = "0.1.0"
authors = [{ name="Genesis Architect", email="architect@quantum.dev" }]
description = "Advanced internal mathematics library with zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/adobemre1/quantum-core-math"
